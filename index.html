<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Mesh Avatar Studio · Play</title>
    <script type="module" crossorigin src="./assets/play-ZetXvIaM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/play-DkXqb4ks.css">
      <meta name="mesh-avatar" content="avatar/office-bun.mavatar">
    <meta name="mesh-voices" content="avatar/office-bun/voices/">
    <meta name="mesh-music" content="avatar/office-bun/music/">
    <meta name="mesh-link" content="https://x.com/RonShi12">
  </head>
  <body>
    <main class="play">
      <div class="play-stage"><canvas id="avatar" aria-label="avatar"></canvas></div>
      <div class="play-status" role="status"></div>
      <div class="play-corner">
        <button class="play-round" data-action="sound" aria-label="voice" aria-pressed="true">🔊</button>
        <button class="play-round" data-action="fullscreen" aria-label="fullscreen">⛶</button>
      </div>
      <nav class="play-dock" aria-label="controls">
        <div class="play-tabs" role="tablist"></div>
        <div class="play-chips"></div>
      </nav>
      <div class="play-touch-log" aria-live="polite"></div>
    </main>
  </body>
</html>
